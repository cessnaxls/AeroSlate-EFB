<!doctype html><html><head><meta charset="utf-8"><title>Set up DispatchLink</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}body{margin:0;background:#071018;color:#e9f3fa;padding:38px}h1{margin:0 0 8px;font-size:30px}p{color:#9db2c2;line-height:1.5}.card{margin-top:24px;background:#0d1a25;border:1px solid #233847;border-radius:16px;padding:22px}label{display:block;font-size:13px;color:#b8cad6}input{box-sizing:border-box;width:100%;margin-top:8px;padding:13px;border-radius:10px;border:1px solid #365164;background:#07131d;color:white;font-size:15px}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#2f9de0;color:#04101a;font-weight:800;cursor:pointer}.error{color:#ff9f9f;min-height:20px;margin-top:10px;font-size:13px}code{color:#77c6f6}</style></head><body>
<h1>Connect the native EFB</h1><p>Enter the public URL of your deployed DispatchLink Render service. This native shell will keep SimBrief and Navigraph sessions inside one application while the Render service provides synchronization, cloud records, and simulator telemetry.</p>
<div class="card"><label>Render service URL<input id="url" type="url" placeholder="https://your-dispatchlink.onrender.com" autofocus></label><button id="save">Open DispatchLink</button><div class="error" id="error"></div></div>
<script>document.getElementById('save').onclick=async()=>{const e=document.getElementById('error');e.textContent='';try{await window.dispatchlinkSetup.complete(document.getElementById('url').value);window.close()}catch(x){e.textContent=x.message||String(x)}};document.getElementById('url').onkeydown=e=>{if(e.key==='Enter')document.getElementById('save').click()}</script></body></html>
