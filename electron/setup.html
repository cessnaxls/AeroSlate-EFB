<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up AeroSlate EFB</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 12%,#153b55 0,transparent 36%),#071018;color:#edf7fd;padding:32px}.shell{width:min(560px,100%)}.logo{width:68px;height:68px;border-radius:19px;background:linear-gradient(145deg,#5ec9ff,#176c9b);display:grid;place-items:center;box-shadow:0 20px 44px #0008;margin-bottom:18px}.logo svg{width:48px}h1{margin:0 0 8px;font-size:31px}p{color:#a7bdcc;line-height:1.55;margin:0}.card{margin-top:24px;background:#0d1a25e8;border:1px solid #294255;border-radius:18px;padding:22px;box-shadow:0 20px 50px #0005}label{display:block;font-size:13px;color:#c4d5df}input{width:100%;margin-top:9px;padding:14px;border-radius:11px;border:1px solid #365164;background:#07131d;color:white;font-size:15px;outline:0}input:focus{border-color:#5ec9ff;box-shadow:0 0 0 3px #5ec9ff22}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#52c4ff,#1681b9);color:#04101a;font-weight:850;cursor:pointer}.error{color:#ffaaaa;min-height:20px;margin-top:10px;font-size:13px}.hint{font-size:12px;margin-top:12px;color:#7690a2}
</style></head>
<body><main class="shell"><div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#06131d" d="M9 42 29 9h17L28 35h27l-8 13H18z"/><path fill="#dff5ff" d="m24 37 31-13-8 13-23 10z"/></svg></div><h1>AeroSlate EFB</h1><p>Connect the native shell to your Render deployment. SimBrief and Navigraph sessions then stay in AeroSlate’s dedicated provider workspace while flight data, records, and simulator telemetry synchronize through your backend.</p><section class="card"><label>Render service URL<input id="url" type="url" placeholder="https://your-aeroslate.onrender.com" autofocus autocomplete="url"></label><button id="save">Open AeroSlate</button><div class="error" id="error"></div><div class="hint">You can change this URL later from Connections &amp; App.</div></section></main><script>const save=document.getElementById('save'),input=document.getElementById('url'),error=document.getElementById('error');save.onclick=async()=>{error.textContent='';try{await window.aeroslateSetup.complete(input.value);window.close()}catch(x){error.textContent=x.message||String(x)}};input.onkeydown=e=>{if(e.key==='Enter')save.click()}</script></body></html>
