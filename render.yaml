services:
  - type: web
    name: aeroslate-efb
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: NAVIGRAPH_CHARTS_APPROVED
        value: "false"
      - key: SIM_LINK_TOKEN
        generateValue: true
