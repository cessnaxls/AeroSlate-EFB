name: Native Windows Build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run native:dist
      - uses: actions/upload-artifact@v4
        with:
          name: DispatchLink-EFB-Windows
          path: release/*
