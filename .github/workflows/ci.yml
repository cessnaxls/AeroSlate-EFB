name: Build
on:
  push:
  pull_request:
jobs:
  build:
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm run test:parser
      - run: npm run build
