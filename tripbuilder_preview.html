<!doctype html><html><head><meta charset='utf-8'><style>
:root{--panel:#071a24;--panel-2:#0b2230;--border:#20465b;--text:#edf6fb;--muted:#89a8b8;--accent:#25b8ff;--accent-2:#20baff}*{box-sizing:border-box}body{margin:0;background:#04131c;color:var(--text);font-family:Arial,sans-serif;padding:24px}.card{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--panel);max-width:1060px;margin:auto}.trip-builder-header{min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0d2a39;border-bottom:1px solid var(--border)}.trip-builder-header h3{margin:0;font-size:20px;letter-spacing:.04em}.trip-builder-header button,button,input,select{border:1px solid var(--border);background:#102c3b;color:var(--text);border-radius:10px;font-size:18px}.trip-builder-header button{padding:10px 16px}.primary{background:linear-gradient(180deg,#29bafa,#1494d2);border-color:#53c8ff}.trip-scheduler > .trip-builder-v160{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:16px 18px 18px;min-width:0}.trip-builder-summary-v160{display:flex;align-items:center;justify-content:space-between;gap:22px;min-width:0;min-height:68px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:#0a202c}.trip-builder-summary-copy-v160{display:grid;gap:7px;min-width:0}.trip-builder-kicker-v160,.trip-builder-field-v160>span,.trip-builder-meta-v160 small{font-size:10px;line-height:1;letter-spacing:.085em;text-transform:uppercase;color:var(--muted);font-weight:800}.trip-builder-route-v160{display:flex;align-items:center;flex-wrap:wrap;gap:8px 15px;min-width:0}.trip-builder-route-v160>strong{font-size:20px;line-height:1.1;white-space:nowrap}.trip-builder-airports-v160{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.trip-builder-airports-v160 b{font-size:17px}.trip-builder-meta-v160{display:grid;grid-template-columns:repeat(2,minmax(92px,auto));gap:8px;flex:0 0 auto}.trip-builder-meta-v160>span{display:grid;gap:6px;min-height:44px;padding:7px 10px;border-left:1px solid var(--border)}.trip-builder-meta-v160 b{font-size:14px;white-space:nowrap}.trip-builder-actions-v160{display:grid;grid-template-columns:minmax(175px,.9fr) minmax(220px,1.15fr) minmax(115px,.58fr) minmax(240px,1.28fr);gap:12px;align-items:end;min-width:0}.trip-builder-field-v160{display:grid;grid-template-rows:14px 46px;gap:7px;min-width:0;margin:0}.trip-builder-field-v160>span{display:flex;align-items:flex-end;white-space:nowrap}.trip-builder-field-v160 input,.trip-builder-field-v160 select,.trip-builder-field-v160 button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-width:0;height:46px;margin:0;padding:0 13px;white-space:nowrap}.trip-builder-field-v160 input{text-align:center}@media(max-width:1080px){.trip-builder-actions-v160{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}}@media(max-width:760px){body{padding:12px}.trip-scheduler>.trip-builder-v160{padding:13px;gap:12px}.trip-builder-summary-v160{align-items:flex-start;gap:14px}.trip-builder-meta-v160{grid-template-columns:1fr}.trip-builder-meta-v160>span{min-height:34px;padding:4px 8px}}@media(max-width:520px){.trip-builder-summary-v160{display:grid}.trip-builder-meta-v160{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.trip-builder-actions-v160{grid-template-columns:minmax(0,1fr)}.trip-builder-route-v160>strong{font-size:18px}}
</style></head><body><section class='card trip-scheduler'><header class='trip-builder-header'><h3>▣ &nbsp; TRIP BUILDER</h3><button>☁ Sync Gist</button></header><div class='trip-builder-v160'><div class='trip-builder-summary-v160'><div class='trip-builder-summary-copy-v160'><span class='trip-builder-kicker-v160'>Selected flight</span><div class='trip-builder-route-v160'><strong>DAL2984</strong><span class='trip-builder-airports-v160'><b>KATL</b><span>✈</span><b>KORF</b></span></div></div><div class='trip-builder-meta-v160'><span><small>Schedule</small><b>23:54z–01:42z</b></span><span><small>Aircraft</small><b>B739</b></span></div></div><div class='trip-builder-actions-v160'><label class='trip-builder-field-v160'><span>Schedule date</span><input value='Aug 6, 2026'></label><div class='trip-builder-field-v160'><span>Add flight</span><button class='primary'>▣ Add selected leg</button></div><label class='trip-builder-field-v160'><span>Rig length</span><select><option>3 legs</option></select></label><div class='trip-builder-field-v160'><span>Quick pairing</span><button>⤨ Generate random rig</button></div></div></div></section></body></html>
